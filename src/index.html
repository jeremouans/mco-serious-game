<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#113124">
  <title>Engagements 2030 — le Quizz</title>
  <link rel="stylesheet" href="/lib/theme.css">
  <style>
    html, body { overflow: hidden; }

    .landing {
      height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(20px, 4vh, 40px); padding: 24px;
      position: relative; z-index: 1; text-align: center;
    }
    .landing-hero { max-width: 640px; }
    .landing-logo { width: min(180px, 45vw); height: auto; margin: 0 auto 22px; display: block; }
    .landing-sub  { font-size: clamp(.95rem, 2vw, 1.15rem); color: var(--fg-soft); font-weight: 500; }

    .landing-btns { display: flex; flex-direction: column; gap: 14px; width: min(380px, 100%); }
    .landing-btn {
      display: flex; align-items: center; gap: 16px;
      background: rgba(241,233,210,.10); color: var(--cream);
      border: 2px solid rgba(241,233,210,.35); border-radius: 16px;
      padding: 18px 22px; cursor: pointer; text-decoration: none;
      transition: background .2s, border-color .2s;
      backdrop-filter: blur(6px);
    }
    .landing-btn:hover { background: var(--green); border-color: var(--green); }
    .lb-icon-wrap {
      width: 52px; height: 52px; border-radius: 12px; flex: none;
      display: grid; place-items: center;
      background: var(--cream); color: var(--ever);
      font-size: 1.5rem;
    }
    .landing-btn:hover .lb-icon-wrap { background: var(--cream); color: var(--green); }
    .lb-txt   { flex: 1; text-align: left; }
    .lb-label { font-size: 1.15rem; font-weight: 700; display: block; color: var(--cream); }
    .lb-desc  { font-size: .82rem; color: rgba(241,233,210,.65); font-weight: 500; display: block; margin-top: 2px; }
    .landing-btn:hover .lb-label,
    .landing-btn:hover .lb-desc,
    .landing-btn:hover .lb-arr { color: #fff; }
    .lb-arr   { font-size: 1.4rem; color: rgba(241,233,210,.7); font-weight: 700; }

    /* ── Gate accès ── */
    #gate {
      position: fixed; inset: 0; z-index: 9999;
      background: var(--ever);
      background-image: url('/assets/masques/kaki.png');
      background-size: cover; background-position: center;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 28px;
    }
    #gate.hidden { display: none; }
    #gate img { width: min(140px, 35vw); height: auto; margin-bottom: 6px; }
    #gate h1 { font-size: clamp(1.3rem, 3.5vw, 1.8rem); font-weight: 700; color: var(--cream); text-align: center; }
    #gate p  { font-size: .95rem; color: rgba(241,233,210,.75); text-align: center; max-width: 420px; }
    #gate-form { display: flex; flex-direction: column; gap: 12px; width: min(340px, 100%); margin-top: 8px; }
    #gate-login, #gate-pass {
      font-family: inherit; font-size: 1rem; font-weight: 500; color: var(--cream);
      background: rgba(241,233,210,.10); border: 2px solid rgba(241,233,210,.30);
      border-radius: 12px; padding: .75em 1.1em; outline: none; transition: border-color .15s;
    }
    #gate-login:focus, #gate-pass:focus { border-color: var(--green-b); }
    #gate-login::placeholder, #gate-pass::placeholder { color: rgba(241,233,210,.45); }
    #gate-submit {
      font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
      background: var(--green); color: #fff; border: none; border-radius: 12px;
      padding: .85em; transition: filter .15s;
    }
    #gate-submit:hover { filter: brightness(1.1); }
    #gate-error { font-size: .88rem; color: #ffb0a0; font-weight: 600; text-align: center; min-height: 1.2em; }
  </style>
</head>
<body class="theme-admin with-mask">
<div id="gate">
  <img src="/assets/logo-beige.svg" alt="Engagements 2030">
  <h1>Engagements 2030</h1>
  <p>Accès réservé — identifiez-vous pour continuer.</p>
  <div id="gate-form">
    <input id="gate-login" type="text"     placeholder="Identifiant" autocomplete="username"     autocapitalize="none" spellcheck="false">
    <input id="gate-pass"  type="password" placeholder="Mot de passe" autocomplete="current-password">
    <div id="gate-error"></div>
    <button id="gate-submit">Accéder →</button>
  </div>
</div>

<div class="landing">
  <div class="landing-hero">
    <img src="/assets/logo-beige.svg" alt="Engagements 2030" class="landing-logo">
    <div class="landing-sub">Serious game MGEN · Temps réel</div>
  </div>
  <div class="landing-btns">
    <a href="/host/" class="landing-btn">
      <span class="lb-icon-wrap">🎯</span>
      <span class="lb-txt">
        <span class="lb-label">Animer</span>
        <span class="lb-desc">Démarrer et piloter une session</span>
      </span>
      <span class="lb-arr">›</span>
    </a>
    <a href="/join/" class="landing-btn">
      <span class="lb-icon-wrap">🙋</span>
      <span class="lb-txt">
        <span class="lb-label">Rejoindre</span>
        <span class="lb-desc">Participer à une partie en cours</span>
      </span>
      <span class="lb-arr">›</span>
    </a>
    <a href="/admin/" class="landing-btn">
      <span class="lb-icon-wrap">⚙️</span>
      <span class="lb-txt">
        <span class="lb-label">Administration</span>
        <span class="lb-desc">Gérer les quiz, l'historique, les accès</span>
      </span>
      <span class="lb-arr">›</span>
    </a>
  </div>
</div>

<script>
;(function() {
  const PASS_KEY = 'mco_gate_ok'
  const gate = document.getElementById('gate')
  if (sessionStorage.getItem(PASS_KEY) === '1') { gate.classList.add('hidden'); return }
  document.getElementById('gate-submit').addEventListener('click', check)
  document.getElementById('gate-pass').addEventListener('keydown', e => { if (e.key === 'Enter') check() })
  document.getElementById('gate-login').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('gate-pass').focus() })
  function check() {
    const login = document.getElementById('gate-login').value.trim()
    const pass  = document.getElementById('gate-pass').value
    if (login === 'mcogames' && pass === 'mcogamesmgen') {
      sessionStorage.setItem(PASS_KEY, '1')
      gate.classList.add('hidden')
    } else {
      const err = document.getElementById('gate-error')
      err.textContent = 'Identifiants incorrects.'
      document.getElementById('gate-pass').value = ''
      document.getElementById('gate-pass').focus()
      setTimeout(() => { err.textContent = '' }, 3000)
    }
  }
})()
</script>
</body>
</html>
